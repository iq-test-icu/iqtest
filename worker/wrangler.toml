name = "apex-iqtest-worker"
main = "worker.js"
compatibility_date = "2026-07-16"
account_id = "ac6add7009ec690cb919dc97d13d6fc6"

[[routes]]
pattern = "iq-test.icu/api/*"
zone_name = "iq-test.icu"

# Daily abandoned-lead recovery sweep (see worker.js `scheduled`). 15:00 UTC
# lands ~9am Mountain Time (Edmonton, AB) year-round give or take an hour of DST drift.
[triggers]
crons = ["0 15 * * *"]

[vars]
ALLOWED_ORIGIN = "https://iq-test.icu"
RESEND_FROM = "IQ Test <report@iq-test.icu>"

# Secrets — set via `wrangler secret put <NAME>`, never committed here:
#   SUPABASE_SERVICE_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   GROQ_API_KEY
#   RESEND_API_KEY
